<title>Arigreet</title>
<style>__CSS__</style>
<style>
/* One phone on a quiet stage. On a real phone the app fills the screen. */
html,body{height:100%;margin:0;overflow:hidden}
body{background:#eceef3 !important;color-scheme:light}
.stage{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding-inline:16px;font:500 13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#6b7282}
.phone{position:relative;width:390px;height:844px;flex-shrink:0;border-radius:58px;padding:12px;background:#0d0f14;
  box-shadow:0 0 0 2px #2a2e38,0 40px 80px -20px rgba(12,20,50,.35),0 12px 30px rgba(12,20,50,.18)}
.screen{position:relative;height:100%;display:flex;flex-direction:column;border-radius:46px;overflow:hidden;background:#fff;transform:translateZ(0)}
.status{position:relative;z-index:500;height:50px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0 34px;font:600 16px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#0b0d12;background:#fff}
.status i{position:absolute;top:11px;left:50%;width:112px;height:32px;margin-left:-56px;border-radius:20px;background:#0d0f14}
.status svg{display:block}
.app{position:relative;flex:1;min-height:0;container-type:size;transform:translateZ(0);overflow:hidden;background:#fff}
#root{height:100%;overflow-y:auto;overflow-x:hidden}
.pv-switch{position:fixed;z-index:450;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);height:30px;padding:0 12px;border:0;border-radius:999px;font:600 12px/1 -apple-system,BlinkMacSystemFont,"Inter var",sans-serif;color:#1a2400;background:#ccff00;box-shadow:0 4px 14px -6px rgba(0,0,0,.35);cursor:pointer;white-space:nowrap}
.app:has(.welcome-experience:not(.phase-shown)) .pv-switch,.app:has(.w-screen.is-active .step-header) .pv-switch,.app:has(.cf-foot) .pv-switch,.app:has(.gb) .pv-switch{display:none}
.app:has(.welcome-experience) .pv-switch{left:auto;right:16px;transform:none}
.pv-switch span{margin-left:4px;font-size:13px}
.bar{display:flex;align-items:center;gap:14px}
.bar button{height:34px;padding:0 14px;border:0;border-radius:999px;font:600 13px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#0b0d12;background:#fff;box-shadow:inset 0 0 0 1px #dfe3ea;cursor:pointer}
.bar button:hover{background:#f6f7fa}
.bar button:focus-visible{outline:2px solid #002fa7;outline-offset:2px}
@media (max-width:520px){
  .stage{padding:0;gap:0}
  .bar,.status{display:none}
  .phone{width:100%;height:100%;border-radius:0;padding:0;box-shadow:none;background:#fff;transform:none!important;margin:0!important}
  .screen{border-radius:0}
}
</style>
<div class="stage">
  <div class="phone" id="phone">
    <div class="screen">
      <div class="status"><span>9:41</span><i></i>
        <svg width="72" height="14" viewBox="0 0 72 14" aria-hidden="true"><g fill="#0b0d12"><rect x="0" y="9" width="3.5" height="5" rx="1"/><rect x="5.5" y="6.5" width="3.5" height="7.5" rx="1"/><rect x="11" y="4" width="3.5" height="10" rx="1"/><rect x="16.5" y="1" width="3.5" height="13" rx="1"/><path d="M33 3.2c2.6 0 5 1 6.8 2.7l1.3-1.3A11.4 11.4 0 0 0 33 1.3c-3.1 0-6 1.2-8.1 3.3l1.3 1.3A9.6 9.6 0 0 1 33 3.2Zm0 3.8c1.6 0 3 .6 4.1 1.6l1.3-1.3A7.7 7.7 0 0 0 33 5.1c-2 0-3.9.8-5.4 2.2l1.3 1.3c1.1-1 2.6-1.6 4.1-1.6Zm0 3.8c.6 0 1.1.2 1.4.5L33 12.7l-1.4-1.4c.4-.3.9-.5 1.4-.5Z"/><rect x="46" y="1.5" width="22" height="11" rx="3.2" fill="none" stroke="#0b0d12" stroke-opacity=".4"/><rect x="47.8" y="3.3" width="18.4" height="7.4" rx="1.8"/><rect x="69.2" y="5" width="1.8" height="4" rx=".9" opacity=".4"/></g></svg>
      </div>
      <div class="app"><div id="root"></div></div>
    </div>
  </div>
  <div class="bar"><span>Arigreet preview · 390 × 844</span><button id="replay" type="button">↺ Start over</button></div>
</div>
<script>
(function(){
  document.getElementById("replay").addEventListener("click",function(){window.postMessage("arigreet-replay","*")});
  var phone=document.getElementById("phone");
  function fit(){
    if(innerWidth<=520){phone.style.transform="";phone.style.margin="";return}
    var s=Math.min(1,(innerHeight-80)/868,(innerWidth-32)/414);
    phone.style.transform="scale("+s+")";
    phone.style.margin=((s-1)*844/2)+"px "+((s-1)*390/2)+"px";
  }
  addEventListener("resize",fit);fit();
})();
</script>
<script type="module">__JS__</script>
